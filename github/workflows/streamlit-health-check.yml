name: Streamlit Deployment Health Check

on:
  schedule:
    # Runs every 8 hours.
    # GitHub scheduled workflows use UTC by default.
    - cron: "17 */8 * * *"

  # Allows the workflow to be tested manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-health-check
  cancel-in-progress: true

jobs:
  check-deployment:
    name: Check live Streamlit app
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Request application
        id: health_check
        shell: bash
        run: |
          APP_URL="https://edgeanalyticsnba.streamlit.app/"

          echo "Checking deployment at: ${APP_URL}"

          HTTP_STATUS=$(curl \
            --location \
            --silent \
            --show-error \
            --output response.html \
            --write-out "%{http_code}" \
            --max-time 120 \
            --retry 2 \
            --retry-delay 10 \
            "${APP_URL}")

          echo "HTTP status: ${HTTP_STATUS}"

          if [[ "${HTTP_STATUS}" -lt 200 || "${HTTP_STATUS}" -ge 400 ]]; then
            echo "::error::Streamlit deployment returned HTTP ${HTTP_STATUS}"
            exit 1
          fi

          echo "Deployment responded successfully."

      - name: Add health-check summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Streamlit Deployment Health Check"
            echo
            echo "- **Application:** NBA Player Performance Pipeline"
            echo "- **URL:** https://edgeanalyticsnba.streamlit.app/"
            echo "- **Checked:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- **Result:** ${{ job.status }}"
          } >> "${GITHUB_STEP_SUMMARY}"
