name: Streamlit Health Check

on:
  schedule:
    # Runs every 8 hours.
    - cron: "17 */8 * * *"

  # Allows manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-health-check
  cancel-in-progress: true

jobs:
  health-check:
    name: Check Streamlit deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Streamlit health endpoint
        shell: bash
        run: |
          HEALTH_URL="https://edgeanalyticsnba.streamlit.app/_stcore/health"

          echo "Checking ${HEALTH_URL}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output response.txt \
            --write-out "%{http_code}" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            "${HEALTH_URL}")

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response:"
          cat response.txt || true

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 400 ]; then
            echo "Streamlit deployment is healthy."
          else
            echo "::error::Streamlit health endpoint returned HTTP ${HTTP_STATUS}."
            exit 1
          fi

      - name: Create workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NBA Pipeline Deployment Check"
            echo
            echo "- **Application:** NBA Player Performance Data Pipeline"
            echo "- **Health endpoint:** https://edgeanalyticsnba.streamlit.app/_stcore/health"
            echo "- **Checked:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- **Result:** ${{ job.status }}"
          } >> "${GITHUB_STEP_SUMMARY}"
