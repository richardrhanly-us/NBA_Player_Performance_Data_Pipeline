name: Streamlit Health Check

on:
  schedule:
    # Run every 8 hours at 17 minutes past the hour.
    - cron: "17 */8 * * *"

  # Allows you to run it manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-health-check
  cancel-in-progress: true

jobs:
  health-check:
    name: Check Streamlit deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check live application
        shell: bash
        run: |
          APP_URL="https://edgeanalyticsnba.streamlit.app/"

          echo "Checking ${APP_URL}"

          HTTP_STATUS=$(curl \
            --location \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            "${APP_URL}")

          echo "HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 400 ]; then
            echo "Streamlit application is responding successfully."
          else
            echo "::error::Streamlit application returned HTTP ${HTTP_STATUS}."
            exit 1
          fi

      - name: Create workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NBA Pipeline Deployment Check"
            echo
            echo "- **Application:** NBA Player Performance Data Pipeline"
            echo "- **URL:** https://edgeanalyticsnba.streamlit.app/"
            echo "- **Checked:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- **Workflow result:** ${{ job.status }}"
          } >> "${GITHUB_STEP_SUMMARY}"
