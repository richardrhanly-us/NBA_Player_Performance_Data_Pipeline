name: Settlement Cycle

# Step 10: settles pending predictions on a fixed schedule. Gated
# behind the same PREDICTION_AUTOMATION_ENABLED kill switch as
# prediction-cycle.yml (see that file and the Step 10 report, Phase 18).
# A manual workflow_dispatch run always executes regardless, for
# testing/incident recovery.
#
# Cadence: every 3 hours (8 runs/day). Settlement only calls the free,
# unauthenticated nba_api-backed BasketballDataProvider -- no paid-API
# quota concern -- so a more generous cadence than the prediction cycle
# is safe. Settlement is idempotent and does not need minute-level
# precision (see src/services/settlement_service.py); this cadence
# exists to catch newly-final games a few times per day, not to race
# final buzzers.

on:
  schedule:
    - cron: "30 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settlement-cycle
  cancel-in-progress: false

jobs:
  run-settlement-cycle:
    name: Settle pending predictions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || vars.PREDICTION_AUTOMATION_ENABLED == 'true'

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PREDICTION_AUTOMATION_ENABLED: ${{ vars.PREDICTION_AUTOMATION_ENABLED }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check prediction-history schema readiness
        shell: bash
        run: python scripts/check_schema_readiness.py

      - name: Run settlement cycle
        shell: bash
        run: python scripts/settle_predictions.py

      - name: Create workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Settlement Cycle"
            echo
            echo "- **Triggered by:** ${{ github.event_name }}"
            echo "- **Result:** ${{ job.status }}"
            echo "- **See the job log above for status/counts (status=SUCCESS|NO_WORK|PARTIAL|FAILED).**"
          } >> "${GITHUB_STEP_SUMMARY}"
