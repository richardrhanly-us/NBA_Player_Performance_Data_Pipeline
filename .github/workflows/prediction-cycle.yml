name: Prediction Cycle

# Step 10: generates and persists today's prediction board on a fixed
# schedule. Gated behind the PREDICTION_AUTOMATION_ENABLED repository
# variable (Settings -> Secrets and variables -> Actions -> Variables) --
# this is the kill switch (see the Step 10 report, Phase 18): merging
# this file does NOT start production automation by itself. A manual
# workflow_dispatch run always executes regardless of the switch, for
# testing/incident recovery (Phase 14) without needing to flip it first.
#
# Cadence: every 2 hours, 13:00-01:00 UTC (7 runs/day) -- roughly
# 7am/8am to 7pm/8pm Central (CST is UTC-6, CDT is UTC-5; this window is
# deliberately generous on both ends rather than hand-adjusted for
# daylight saving, see the report's scheduling-policy section). This
# covers the NBA's pregame window without running once games are
# already underway for the night -- the per-game pregame filter inside
# run_prediction_cycle() is the real safety net regardless.

on:
  schedule:
    - cron: "0 13,15,17,19,21,23,1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prediction-cycle
  cancel-in-progress: false

jobs:
  run-prediction-cycle:
    name: Generate and persist today's prediction board
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || vars.PREDICTION_AUTOMATION_ENABLED == 'true'

    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PREDICTION_AUTOMATION_ENABLED: ${{ vars.PREDICTION_AUTOMATION_ENABLED }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check prediction-history schema readiness
        shell: bash
        run: python scripts/check_schema_readiness.py

      - name: Run prediction cycle
        shell: bash
        run: python scripts/persist_prediction_board.py

      - name: Create workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Prediction Cycle"
            echo
            echo "- **Triggered by:** ${{ github.event_name }}"
            echo "- **Result:** ${{ job.status }}"
            echo "- **See the job log above for status/counts (status=SUCCESS|NO_WORK|PARTIAL|FAILED).**"
          } >> "${GITHUB_STEP_SUMMARY}"
