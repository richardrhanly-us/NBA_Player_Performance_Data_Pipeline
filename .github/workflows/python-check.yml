name: Python Code Check

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/python-check.yml"

  pull_request:
    branches:
      - main
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/python-check.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        shell: bash
        run: |
          python -m compileall -q apps scripts src tests training

      - name: Verify important imports
        shell: bash
        run: |
          python -c "import pandas"
          python -c "import streamlit"
          python -c "import sklearn"

      - name: Run tests
        shell: bash
        run: |
          python -m pytest tests -v

      - name: Create workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Python Code Check"
            echo
            echo "- **Python version:** 3.11"
            echo "- **Syntax validation:** apps, scripts, src, tests, and training"
            echo "- **Dependency installation:** requirements.txt"
            echo "- **Tests:** pytest tests/"
            echo "- **Result:** ${{ job.status }}"
          } >> "${GITHUB_STEP_SUMMARY}"
